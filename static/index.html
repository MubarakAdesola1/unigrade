<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGrade</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 UniGrade GPA Calculator</h1>
        <p class="subtitle">Enter your CA and Exam scores for each course</p>

        <form action="/calculate" method="POST">
            <!-- Student Information -->
            <div class="course">
                <h3>👤 Student Information</h3>
                <label>Full Name:</label>
                <input type="text" name="name" required placeholder="Enter your full name" style="width: 300px;">
                <label>Matric Number:</label>
                <input type="text" name="matric" required placeholder="e.g. ABC/2021/001" style="width: 300px;">
                <label>Level:</label>
                <select name="level" style="padding: 8px; width: 150px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="100L">100 Level</option>
                    <option value="200L">200 Level</option>
                    <option value="300L">300 Level</option>
                    <option value="400L">400 Level</option>
                    <option value="500L">500 Level</option>
                </select>
                <label>Semester:</label>
                <select name="semester" style="padding: 8px; width: 150px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="First Semester">First Semester</option>
                    <option value="Second Semester">Second Semester</option>
                </select>
                <label>Number of Courses:</label>
                <select name="numCourses" id="numCourses" onchange="generateCourses()" style="padding: 8px; width: 150px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="4">4 Courses</option>
                    <option value="5">5 Courses</option>
                    <option value="6" selected>6 Courses</option>
                    <option value="7">7 Courses</option>
                    <option value="8">8 Courses</option>
                </select>
            </div>

            <!-- Dynamic Course Rows -->
            <div id="coursesContainer"></div>

            <button type="submit">Calculate GPA 🎓</button>
        </form>
    </div>

    <script>
        // Generate course rows based on number selected
        function generateCourses() {
            const num = parseInt(document.getElementById('numCourses').value);
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';

            for (let i = 0; i < num; i++) {
                container.innerHTML += `
                    <div class="course">
                        <h3>Course ${i + 1}</h3>
                        <label>Course Name:</label>
                        <input type="text" name="subject${i}" required placeholder="e.g. Mathematics" style="width: 300px;">
                        <label>Credit Unit:</label>
                        <select name="unit${i}" style="padding: 8px; width: 100px; border: 1px solid #ccc; border-radius: 4px;">
                            <option value="1">1 Unit</option>
                            <option value="2">2 Units</option>
                            <option value="3">3 Units</option>
                        </select>
                        <label>CA Mark (out of 40):</label>
                        <input type="number" name="ca${i}" min="0" max="40" required placeholder="0-40">
                        <label>Exam Mark (out of 60):</label>
                        <input type="number" name="exam${i}" min="0" max="60" required placeholder="0-60">
                    </div>
                `;
            }
        }

        // Generate courses on page load with default value (6)
        generateCourses();
    </script>
</body>
</html>
